<svg xmlns="http://www.w3.org/2000/svg" width="730" height="400" viewBox="0 0 730 400" role="img" aria-labelledby="title desc"><title id="title">Model proposal and publication boundary</title><desc id="desc">LLM produces a structured proposal, editorial validation decides whether it proceeds, rejection goes to correction, acceptance goes to delivery.</desc><rect width="730" height="400" rx="18" fill="#f4f4f0"/><text x="44" y="54" font-family="Arial,sans-serif" fill="#171717" font-size="23" font-weight="bold">The validation boundary</text><text x="44" y="82" font-family="Arial,sans-serif" fill="#67655e" font-size="14">A model recommendation is not publication authorization.</text><rect x="196" y="116" width="338" height="62" rx="12" fill="#fff" stroke="#c9c8c0" stroke-width="2"/><text x="365" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#252525">LLM proposes a post</text><text x="365" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#666">publish · post_text · reason</text><path d="M365 179V208" stroke="#777" stroke-width="2.5"/><path d="M359 201L365 211L371 201" fill="none" stroke="#777" stroke-width="2.5"/><rect x="196" y="213" width="338" height="60" rx="12" fill="#eae9e3" stroke="#96938b" stroke-width="2"/><text x="365" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#252525">Schema + editorial validation</text><text x="365" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">Length · URLs · attribution · substance</text><path d="M260 273V312M470 273V312" stroke="#777" stroke-width="2"/><rect x="76" y="316" width="277" height="53" rx="10" fill="#fff3f0" stroke="#b8897c"/><rect x="377" y="316" width="277" height="53" rx="10" fill="#eef6ed" stroke="#86a38a"/><text x="214" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#713c31">Rejected</text><text x="214" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#713c31">Correct / fall back / stop</text><text x="516" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#315e38">Accepted</text><text x="516" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#315e38">Eligible for separate delivery</text></svg>