<svg xmlns="http://www.w3.org/2000/svg" width="730" height="430" viewBox="0 0 730 430" role="img" aria-labelledby="title desc">
<title id="title">AI assistance and engineering ownership</title>
<desc id="desc">Two parallel roles feed into production software: AI assists with implementation, test drafts and debugging suggestions, while the engineer owns requirements, architecture and acceptance. The result is software evaluated for correctness, reliability and maintainability.</desc>
<rect width="730" height="430" rx="12" fill="#fafaf8"/>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
<rect x="30" y="30" width="322" height="250" rx="12" fill="#f1f6ff" stroke="#84a9e7" stroke-width="1.4"/>
<rect x="378" y="30" width="322" height="250" rx="12" fill="#eef9f3" stroke="#7dbb9e" stroke-width="1.4"/>
<rect x="108" y="50" width="166" height="29" rx="14.5" fill="#e0ebff"/>
<rect x="446" y="50" width="190" height="29" rx="14.5" fill="#d8f2e5"/>
<text x="191" y="69" font-size="15" font-weight="700" fill="#294c8c">AI assistance</text>
<text x="541" y="69" font-size="15" font-weight="700" fill="#24674e">Engineering ownership</text>
<text x="191" y="116" font-size="17" font-weight="650" fill="#19263c">Generate implementation</text>
<text x="191" y="159" font-size="17" font-weight="650" fill="#19263c">Draft tests and fixtures</text>
<text x="191" y="202" font-size="17" font-weight="650" fill="#19263c">Suggest fixes</text>
<text x="541" y="116" font-size="17" font-weight="650" fill="#1c3d30">Define requirements</text>
<text x="541" y="159" font-size="17" font-weight="650" fill="#1c3d30">Choose architecture</text>
<text x="541" y="202" font-size="17" font-weight="650" fill="#1c3d30">Review and accept</text>
<text x="191" y="249" font-size="12" fill="#5c7296">Execution support</text>
<text x="541" y="249" font-size="12" fill="#5d8371">Accountability for outcomes</text>
