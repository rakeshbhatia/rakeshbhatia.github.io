<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-label="Forward processing compared with guarded targeted repair"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243047}.head{font-size:24px;font-weight:700}.sub{font-size:15px;fill:#667085}.label{font-size:18px;font-weight:700}.small{font-size:14px;fill:#475467}.pill{fill:#fff;stroke:#d8e0e9;stroke-width:2}.blue{fill:#eef5ff;stroke:#a6c9f5;stroke-width:2}.green{fill:#effaf5;stroke:#91cdb5;stroke-width:2}.line{stroke:#71839b;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1000" height="570" rx="22" fill="#fafbf9"/><text x="500" y="56" class="head" text-anchor="middle">Two paths through the same data</text><text x="500" y="85" class="sub" text-anchor="middle">Initial processing writes decisions; repair revisits only a verified selection.</text><text x="255" y="140" class="label" text-anchor="middle">Forward processing</text><rect x="80" y="165" width="350" height="70" rx="12" class="pill"/><text x="255" y="207" class="label" text-anchor="middle">Original records</text><path class="line" d="M255 239 V275 m-6 -7 l6 7 6 -7"/><rect x="80" y="283" width="350" height="70" rx="12" class="blue"/><text x="255" y="325" class="label" text-anchor="middle">Model / rules v1</text><path class="line" d="M255 357 V393 m-6 -7 l6 7 6 -7"/><rect x="80" y="401" width="350" height="70" rx="12" class="pill"/><text x="255" y="443" class="label" text-anchor="middle">Derived decisions</text><text x="745" y="140" class="label" text-anchor="middle">Targeted repair</text><rect x="570" y="165" width="350" height="70" rx="12" class="pill"/><text x="745" y="207" class="label" text-anchor="middle">Select + snapshot</text><path class="line" d="M745 239 V275 m-6 -7 l6 7 6 -7"/><rect x="570" y="283" width="350" height="70" rx="12" class="pill"/><text x="745" y="325" class="label" text-anchor="middle">Validate + recompute</text><path class="line" d="M745 357 V393 m-6 -7 l6 7 6 -7"/><rect x="570" y="401" width="350" height="70" rx="12" class="green"/><text x="745" y="443" class="label" text-anchor="middle">Verify new decisions</text><text x="500" y="545" class="sub" text-anchor="middle">Preserve inputs · Bound mutations · Keep a recovery path</text></svg>