<svg xmlns="http://www.w3.org/2000/svg" width="730" height="400" viewBox="0 0 730 400" role="img" aria-labelledby="title desc"><title id="title">Bounded validation recovery</title><desc id="desc">Invalid draft gets specific feedback and one bounded correction; accepted output proceeds, repeated failure causes model fallback or rejection.</desc><rect width="730" height="400" rx="18" fill="#f4f4f0"/><text x="44" y="54" font-family="Arial,sans-serif" fill="#171717" font-size="23" font-weight="bold">Bounded correction, not endless retries</text><text x="44" y="82" font-family="Arial,sans-serif" fill="#67655e" font-size="14">Keep the rule fixed while requesting a corrected draft.</text><rect x="178" y="113" width="374" height="55" rx="10" fill="#fff3f0" stroke="#bb988d" stroke-width="2"/><text x="365" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#713c31">Draft fails editorial validation</text><text x="365" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#713c31">Specific rule + rejected text retained</text><path d="M365 168V195" stroke="#777" stroke-width="2"/><rect x="178" y="197" width="374" height="55" rx="10" fill="white" stroke="#c9c8c0" stroke-width="2"/><text x="365" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#252525">Targeted correction request</text><text x="365" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#666">Preserve supported factual meaning</text><path d="M365 252V277" stroke="#777" stroke-width="2"/><rect x="178" y="278" width="374" height="43" rx="10" fill="#eae9e3" stroke="#96938b" stroke-width="2"/><text x="365" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#252525">Validate again · limited attempts</text><path d="M260 321V337M470 321V337" stroke="#777" stroke-width="2"/><rect x="66" y="339" width="283" height="44" rx="9" fill="#eef6ed" stroke="#86a38a"/><rect x="381" y="339" width="283" height="44" rx="9" fill="#fff3f0" stroke="#bb988d"/><text x="208" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#315e38">Pass</text><text x="208" y="373" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#315e38">Continue to separate delivery</text><text x="522" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#713c31">Still fails</text><text x="522" y="373" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#713c31">Fallback model or reject candidate</text></svg>