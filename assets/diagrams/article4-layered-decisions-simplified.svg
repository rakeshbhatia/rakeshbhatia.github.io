<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 455" role="img" aria-labelledby="title desc"><title id="title">A layered text classification pipeline</title><desc id="desc">Incoming documents pass through deterministic rules, which may decide immediately, or through TF-IDF and XGBoost. Relevant news is passed to embedding-based topic classification. Irrelevant items exit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#959993"/></marker><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#242724}.main{font-size:18px;font-weight:700}.detail{font-size:13px;fill:#69716d}.small{font-size:12px;fill:#64706a}.pill{font-size:12px;font-weight:650}.line{fill:none;stroke:#959993;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect x="0" y="0" width="730" height="455" rx="0" fill="#fafaf8" stroke="#fafaf8" stroke-width="1.4"/><rect x="205" y="22" width="320" height="58" rx="12" fill="#fff" stroke="#d6ddd7" stroke-width="1.4"/><text x="365" y="48" class="main" text-anchor="middle">Incoming document</text><text x="365" y="67" class="detail" text-anchor="middle">Title, description, source category</text><path class="line" d="M365 80 L365 113"/><rect x="205" y="115" width="320" height="66" rx="12" fill="#edf5f3" stroke="#8dbbb2" stroke-width="1.4"/><text x="365" y="143" class="main" text-anchor="middle">Deterministic rules</text><text x="365" y="163" class="detail" text-anchor="middle">Known exclusions and shortcuts</text><path class="line" d="M205 148 L117 148"/><rect x="12" y="119" width="142" height="59" rx="12" fill="#f9eeee" stroke="#e3b6ae" stroke-width="1.4"/><text x="83" y="145" class="pill" text-anchor="middle">Rule shortcut</text><text x="83" y="163" class="small" text-anchor="middle">Accept or reject</text><path class="line" d="M365 181 L365 217"/><rect x="205" y="220" width="320" height="67" rx="12" fill="#edf2fc" stroke="#9db8e6" stroke-width="1.4"/><text x="365" y="249" class="main" text-anchor="middle">TF-IDF + XGBoost</text><text x="365" y="270" class="detail" text-anchor="middle">Classify items not resolved by rules</text><path class="line" d="M525 252 L550 252 L550 310 L574 310"/><rect x="574" y="282" width="143" height="56" rx="12" fill="#f9eeee" stroke="#e3b6ae" stroke-width="1.4"/><text x="646" y="305" class="pill" text-anchor="middle">Not relevant</text><text x="646" y="324" class="small" text-anchor="middle">Stop processing</text><path class="line" d="M365 287 L365 320"/><rect x="205" y="323" width="320" height="72" rx="12" fill="#f0f7ef" stroke="#9cc99b" stroke-width="1.4"/><text x="365" y="351" class="main" text-anchor="middle">Relevant news</text><text x="365" y="372" class="detail" text-anchor="middle">Embeddings → topic / subtopic models</text><text x="366" y="429" class="detail" text-anchor="middle">Use the simplest effective decision before richer analysis.</text></svg>