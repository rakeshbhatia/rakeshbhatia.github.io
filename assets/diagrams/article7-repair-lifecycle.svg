<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-label="Six steps of bounded data repair from selection to outcome verification"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#243047}.head{font-size:24px;font-weight:700}.sub{font-size:15px;fill:#667085}.label{font-size:18px;font-weight:700}.small{font-size:14px;fill:#475467}.pill{fill:#fff;stroke:#d8e0e9;stroke-width:2}.blue{fill:#eef5ff;stroke:#a6c9f5;stroke-width:2}.green{fill:#effaf5;stroke:#91cdb5;stroke-width:2}.line{stroke:#71839b;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1000" height="570" rx="22" fill="#fafbf9"/><text x="500" y="52" class="head" text-anchor="middle">A guarded historical repair</text><text x="500" y="82" class="sub" text-anchor="middle">The decision to mutate should be as deliberate as the new prediction.</text><rect x="72" y="130" width="265" height="110" rx="12" class="pill"/><text x="204" y="173" class="label" text-anchor="middle">1  Select</text><text x="204" y="205" class="small" text-anchor="middle">Explicit IDs</text><path class="line" d="M340 185 h30 m-8 -6 l8 6 -8 6"/><rect x="382" y="130" width="265" height="110" rx="12" class="pill"/><text x="514" y="173" class="label" text-anchor="middle">2  Dry run</text><text x="514" y="205" class="small" text-anchor="middle">Preview changes</text><path class="line" d="M650 185 h30 m-8 -6 l8 6 -8 6"/><rect x="692" y="130" width="265" height="110" rx="12" class="pill"/><text x="824" y="173" class="label" text-anchor="middle">3  Snapshot</text><text x="824" y="205" class="small" text-anchor="middle">Preserve old state</text><rect x="72" y="310" width="265" height="110" rx="12" class="blue"/><text x="204" y="353" class="label" text-anchor="middle">4  Validate</text><text x="204" y="385" class="small" text-anchor="middle">Check membership</text><path class="line" d="M340 365 h30 m-8 -6 l8 6 -8 6"/><rect x="382" y="310" width="265" height="110" rx="12" class="pill"/><text x="514" y="353" class="label" text-anchor="middle">5  Apply</text><text x="514" y="385" class="small" text-anchor="middle">Coordinated writes</text><path class="line" d="M650 365 h30 m-8 -6 l8 6 -8 6"/><rect x="692" y="310" width="265" height="110" rx="12" class="green"/><text x="824" y="353" class="label" text-anchor="middle">6  Verify</text><text x="824" y="385" class="small" text-anchor="middle">Inspect outcomes</text><path class="line" d="M824 253 V282 H203 V307 m-6 -7 l6 7 6 -7"/><text x="500" y="511" class="sub" text-anchor="middle">If checks fail: abort, or restore the recorded snapshot where applicable.</text></svg>