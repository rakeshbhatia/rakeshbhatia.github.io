<svg xmlns="http://www.w3.org/2000/svg" width="730" height="410" viewBox="0 0 730 410" role="img" aria-labelledby="title desc">
<title id="title">AI-assisted engineering verification loop</title>
<desc id="desc">An engineer specifies the change, AI proposes an implementation, and tests plus inspection check behavior and assumptions. The engineer accepts the change or revises the specification and repeats the process.</desc>
<rect width="730" height="410" rx="12" fill="#fafaf8"/>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
<rect x="233" y="20" width="264" height="62" rx="9" fill="#ffffff" stroke="#b6b9b6" stroke-width="1.4"/>
<text x="365" y="46" font-weight="700" font-size="16" fill="#222">Specify the change</text>
<text x="365" y="65" font-size="12" fill="#72736f">Goal · Constraints · Interfaces</text>
<path d="M365 82 V111" stroke="#92958f" stroke-width="1.7" fill="none"/><path d="M359 103 L365 112 L371 103" stroke="#92958f" stroke-width="1.7" fill="none"/>
<rect x="233" y="116" width="264" height="62" rx="9" fill="#edf3ff" stroke="#8cabe0" stroke-width="1.4"/>
<text x="365" y="142" font-weight="700" font-size="16" fill="#2c4e87">Generate a candidate</text>
<text x="365" y="161" font-size="12" fill="#667da0">Implementation · Tests</text>
<path d="M365 178 V207" stroke="#92958f" stroke-width="1.7" fill="none"/><path d="M359 199 L365 208 L371 199" stroke="#92958f" stroke-width="1.7" fill="none"/>
<rect x="233" y="212" width="264" height="62" rx="9" fill="#fff" stroke="#b6b9b6" stroke-width="1.4"/>
<text x="365" y="238" font-weight="700" font-size="16" fill="#222">Verify and inspect</text>
<text x="365" y="257" font-size="12" fill="#72736f">Behavior · Assumptions · Scope</text>
<path d="M365 274 V301 H210 V317" stroke="#92958f" stroke-width="1.7" fill="none"/>
<path d="M365 301 H520 V317" stroke="#92958f" stroke-width="1.7" fill="none"/>
<path d="M204 309 L210 318 L216 309 M514 309 L520 318 L526 309" stroke="#92958f" stroke-width="1.7" fill="none"/>
<rect x="80" y="322" width="260" height="60" rx="9" fill="#edf9f2" stroke="#86bea1" stroke-width="1.4"/>
<rect x="390" y="322" width="260" height="60" rx="9" fill="#fff5ea" stroke="#dda86d" stroke-width="1.4"/>
<text x="210" y="348" font-weight="750" font-size="17" fill="#245943">Accept</text>
<text x="210" y="368" font-size="12" fill="#61836e">After evidence and review</text>
<text x="520" y="348" font-weight="750" font-size="17" fill="#925724">Revise</text>
<text x="520" y="368" font-size="12" fill="#a8794d">Correct the design or code</text>
</g>
<path d="M650 351 H687 Q700 351 700 337 V147 Q700 134 687 134 H503" fill="none" stroke="#d09960" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M512 128 L502 134 L512 140" fill="none" stroke="#d09960" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
