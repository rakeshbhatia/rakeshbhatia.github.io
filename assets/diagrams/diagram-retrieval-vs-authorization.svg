<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 796" role="img" aria-labelledby="d3-title d3-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="d3-title">Retrieval vs. authorization</title>
  <desc id="d3-desc">A new document goes through embedding retrieval to produce candidate clusters. A structured event comparison checks what happened, entities, timing, material change, and background versus same event. If it is the same underlying event the document merges into the existing cluster; otherwise it starts a new cluster.</desc>
  <defs>
    <marker id="d3-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#5B564E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g id="stage-labels">
    <text x="20" y="176" font-size="12" font-weight="700" letter-spacing="1.2" fill="#1E4580">RETRIEVAL</text>
    <text x="20" y="195" font-size="13" fill="#4A453E">high recall</text>
    <text x="20" y="378" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4E3790">AUTHORIZATION</text>
    <text x="20" y="397" font-size="13" fill="#4A453E">high precision</text>
  </g>
  <g fill="none" stroke="#5B564E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M365 68 V94" marker-end="url(#d3-arrow)"/>
    <path d="M365 172 V198" marker-end="url(#d3-arrow)"/>
    <path d="M365 276 V302" marker-end="url(#d3-arrow)"/>
    <path d="M365 458 V485" marker-end="url(#d3-arrow)"/>
    <path d="M215 545 H165 V636" marker-end="url(#d3-arrow)"/>
    <path d="M515 545 H565 V636" marker-end="url(#d3-arrow)"/>
  </g>
  <g id="new-document">
    <rect x="265" y="16" width="200" height="50" rx="10" fill="#FFFFFF" stroke="#BDB7AA" stroke-width="1.5"/>
    <text x="365" y="47" font-size="16" font-weight="700" text-anchor="middle" fill="#24211D">New document</text>
  </g>
  <g id="embedding-retrieval">
    <rect x="215" y="98" width="300" height="72" rx="10" fill="#EDF3FB" stroke="#2F5FA8" stroke-width="1.5"/>
    <text x="365" y="128" font-size="17" font-weight="700" text-anchor="middle" fill="#24211D">Embedding retrieval</text>
    <text x="365" y="152" font-size="14" text-anchor="middle" fill="#4A453E">Find plausible clusters</text>
  </g>
  <g id="candidate-clusters">
    <rect x="215" y="202" width="300" height="72" rx="10" fill="#E7F5F3" stroke="#1B7F79" stroke-width="1.5"/>
    <text x="365" y="232" font-size="17" font-weight="700" text-anchor="middle" fill="#24211D">Candidate clusters</text>
    <text x="365" y="256" font-size="14" text-anchor="middle" fill="#4A453E">Top semantic matches</text>
  </g>
  <g id="structured-comparison">
    <rect x="150" y="306" width="430" height="150" rx="10" fill="#F1EDFA" stroke="#6246A8" stroke-width="1.5"/>
    <text x="365" y="339" font-size="17" font-weight="700" text-anchor="middle" fill="#24211D">Structured event comparison</text>
    <g fill="#FFFFFF" stroke="#6246A8" stroke-width="1">
      <rect x="227" y="360" width="110" height="32" rx="16"/>
      <rect x="347" y="360" width="76" height="32" rx="16"/>
      <rect x="433" y="360" width="70" height="32" rx="16"/>
      <rect x="206" y="402" width="122" height="32" rx="16"/>
      <rect x="338" y="402" width="186" height="32" rx="16"/>
    </g>
    <g font-size="13" text-anchor="middle" fill="#24211D">
      <text x="282" y="381">what happened</text>
      <text x="385" y="381">entities</text>
      <text x="468" y="381">timing</text>
      <text x="267" y="423">material change</text>
      <text x="431" y="423">background vs. same event</text>
    </g>
  </g>
  <g id="decision">
    <polygon points="365,489 515,545 365,601 215,545" fill="#FFFFFF" stroke="#4A453E" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="365" y="551" font-size="16" font-weight="700" text-anchor="middle" fill="#24211D">Same underlying event?</text>
    <text x="190" y="536" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#1F6540">YES</text>
    <text x="540" y="536" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#8F4A05">NO</text>
  </g>
  <g id="merge">
    <rect x="30" y="640" width="270" height="88" rx="10" fill="#E9F5EE" stroke="#2D7D4E" stroke-width="1.5"/>
    <text x="165" y="674" font-size="18" font-weight="700" letter-spacing="0.6" text-anchor="middle" fill="#24211D">MERGE</text>
    <text x="165" y="700" font-size="14" text-anchor="middle" fill="#4A453E">Existing cluster</text>
  </g>
  <g id="new-cluster">
    <rect x="430" y="640" width="270" height="88" rx="10" fill="#FDF3E3" stroke="#B25E09" stroke-width="1.5"/>
    <text x="565" y="674" font-size="18" font-weight="700" letter-spacing="0.6" text-anchor="middle" fill="#24211D">NEW CLUSTER</text>
    <text x="565" y="700" font-size="14" text-anchor="middle" fill="#4A453E">Keep event identity separate</text>
  </g>
  <text x="365" y="772" font-size="15" text-anchor="middle" fill="#4A453E">Embeddings retrieve candidates. A stricter identity layer authorizes the merge.</text>
</svg>
