<svg xmlns="http://www.w3.org/2000/svg" width="730" height="430" viewBox="0 0 730 430" role="img" aria-labelledby="title desc"><title id="title">Row-oriented versus batch-oriented persistence</title><desc id="desc">Compare repeated reads and writes per record with a batched fetch and grouped update submission. Batch submissions do not guarantee one database round trip.</desc><rect width="730" height="430" rx="20" fill="#fafaf8"/><style>text{font-family:Inter,system-ui,sans-serif;fill:#262626}.h{font-size:19px;font-weight:750}.s{font-size:14px;fill:#62625d}.b{font-size:15px;font-weight:650}.foot{font-size:13px;fill:#73716a}</style><rect x="27" y="42" width="328" height="322" rx="16" fill="#fff" stroke="#dfded8"/><rect x="375" y="42" width="328" height="322" rx="16" fill="#fff" stroke="#dfded8"/><text x="191" y="80" text-anchor="middle" class="h">Row-oriented</text><text x="539" y="80" text-anchor="middle" class="h">Batch-oriented</text><rect x="53" y="106" width="276" height="50" rx="10" fill="#fef1eb" stroke="#eec0b0"/><text x="191" y="126" text-anchor="middle" class="b">Article 1</text><text x="191" y="145" text-anchor="middle" class="s">Read → classify → write</text><rect x="53" y="170" width="276" height="50" rx="10" fill="#fef1eb" stroke="#eec0b0"/><text x="191" y="190" text-anchor="middle" class="b">Article 2</text><text x="191" y="209" text-anchor="middle" class="s">Read → classify → write</text><rect x="53" y="234" width="276" height="50" rx="10" fill="#fef1eb" stroke="#eec0b0"/><text x="191" y="254" text-anchor="middle" class="b">Article 3</text><text x="191" y="273" text-anchor="middle" class="s">Read → classify → write</text><rect x="407" y="116" width="264" height="55" rx="10" fill="#eaf1fc" stroke="#a7c2eb"/><text x="539" y="139" text-anchor="middle" class="b">Fetch required rows</text><text x="539" y="157" text-anchor="middle" class="s">Together</text><path d="M539 173V201" stroke="#93938d" stroke-width="2"/><path d="M533 195L539 203L545 195" fill="none" stroke="#93938d" stroke-width="2"/><rect x="407" y="208" width="264" height="55" rx="10" fill="#f3f3ef" stroke="#ddddd7"/><text x="539" y="230" text-anchor="middle" class="b">Classify rows</text><text x="539" y="249" text-anchor="middle" class="s">Collect changed values</text><path d="M539 265V291" stroke="#93938d" stroke-width="2"/><path d="M533 285L539 293L545 285" fill="none" stroke="#93938d" stroke-width="2"/><rect x="407" y="298" width="264" height="48" rx="10" fill="#e5f5eb" stroke="#9dcfb0"/><text x="539" y="327" text-anchor="middle" class="b">Submit grouped updates</text><text x="191" y="337" text-anchor="middle" class="s">Many separate interactions</text><text x="365" y="400" text-anchor="middle" class="foot">Conceptual comparison · Driver behavior determines actual round trips</text></svg>