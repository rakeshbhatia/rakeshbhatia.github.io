<svg xmlns="http://www.w3.org/2000/svg" width="730" height="370" viewBox="0 0 730 370" role="img" aria-labelledby="title desc"><title id="title">Bound the data scope before model inference</title><desc id="desc">Data selection, query shape, inference, and persistence are separate stages whose cost should be measured.</desc><rect width="730" height="370" rx="20" fill="#fafaf8"/><style>text{font-family:Inter,system-ui,sans-serif;fill:#262626}.h{font-size:19px;font-weight:750}.s{font-size:14px;fill:#62625d}.b{font-size:15px;font-weight:650}.foot{font-size:13px;fill:#73716a}</style><rect x="25" y="113" width="164" height="133" rx="15" fill="#eaf1fc" stroke="#a7c2eb"/><text x="107" y="157" class="b" text-anchor="middle">Bound eligible data</text><text x="107" y="185" class="s" text-anchor="middle">Time windows</text><path d="M189 179H204" stroke="#91918c" stroke-width="2"/><path d="M199 174L205 179L199 184" fill="none" stroke="#91918c" stroke-width="2"/><rect x="205" y="113" width="164" height="133" rx="15" fill="#f1edf9" stroke="#c7b6e3"/><text x="287" y="157" class="b" text-anchor="middle">Retrieve candidates</text><text x="287" y="185" class="s" text-anchor="middle">Indexes and filters</text><path d="M369 179H384" stroke="#91918c" stroke-width="2"/><path d="M379 174L385 179L379 184" fill="none" stroke="#91918c" stroke-width="2"/><rect x="385" y="113" width="164" height="133" rx="15" fill="#fff2e8" stroke="#e9c0a2"/><text x="467" y="157" class="b" text-anchor="middle">Run inference</text><text x="467" y="185" class="s" text-anchor="middle">Model work</text><path d="M549 179H564" stroke="#91918c" stroke-width="2"/><path d="M559 174L565 179L559 184" fill="none" stroke="#91918c" stroke-width="2"/><rect x="565" y="113" width="164" height="133" rx="15" fill="#e5f5eb" stroke="#9dcfb0"/><text x="647" y="157" class="b" text-anchor="middle">Persist results</text><text x="647" y="185" class="s" text-anchor="middle">Grouped writes</text><text x="365" y="77" text-anchor="middle" class="h">Optimize the work the pipeline actually performs</text><text x="365" y="300" text-anchor="middle" class="s">Measure each stage before optimizing a single component</text></svg>