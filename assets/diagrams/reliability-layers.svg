<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 360" role="img" aria-labelledby="l1-title l1-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title id="l1-title">Three reliability layers</title>
  <desc id="l1-desc">Three separate layers. Decision asks whether the item should be published. State asks whether it has already entered the workflow. Delivery asks which external actions completed. They are separate concerns, not one transaction.</desc>
  <defs>
    <marker id="l1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#8A867D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="730" height="360" fill="#FAFAF8"/>

  <!-- Card 1: Decision -->
  <g id="decision">
    <rect x="8" y="20" width="216" height="240" rx="10" fill="#EDF3FB" stroke="#2F5FA8" stroke-width="1.5"/>
    <text x="28" y="58" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#1E4580">DECISION</text>
    <line x1="28" y1="74" x2="204" y2="74" stroke="#BFD0E8" stroke-width="1"/>
    <g font-size="17" font-weight="700" fill="#181817">
      <text x="28" y="110">Should this item</text>
      <text x="28" y="136">be published?</text>
    </g>
    <line x1="28" y1="190" x2="204" y2="190" stroke="#BFD0E8" stroke-width="1"/>
    <text x="28" y="214" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#4A4A47">OWNS</text>
    <text x="28" y="236" font-size="14" fill="#181817">Eligibility and policy</text>
  </g>

  <!-- Card 2: State -->
  <g id="state">
    <rect x="257" y="20" width="216" height="240" rx="10" fill="#FFFFFF" stroke="#8A867D" stroke-width="1.5"/>
    <text x="277" y="58" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#4A4A47">STATE</text>
    <line x1="277" y1="74" x2="453" y2="74" stroke="#DAD7CE" stroke-width="1"/>
    <g font-size="17" font-weight="700" fill="#181817">
      <text x="277" y="110">Has it entered</text>
      <text x="277" y="136">the workflow</text>
      <text x="277" y="162">already?</text>
    </g>
    <line x1="277" y1="190" x2="453" y2="190" stroke="#DAD7CE" stroke-width="1"/>
    <text x="277" y="214" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#4A4A47">OWNS</text>
    <text x="277" y="236" font-size="14" fill="#181817">The workflow record</text>
  </g>

  <!-- Card 3: Delivery -->
  <g id="delivery">
    <rect x="506" y="20" width="216" height="240" rx="10" fill="#E6F4EE" stroke="#1F7A5C" stroke-width="1.5"/>
    <text x="526" y="58" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#165C45">DELIVERY</text>
    <line x1="526" y1="74" x2="702" y2="74" stroke="#B5D9C8" stroke-width="1"/>
    <g font-size="17" font-weight="700" fill="#181817">
      <text x="526" y="110">Which external</text>
      <text x="526" y="136">actions</text>
      <text x="526" y="162">completed?</text>
    </g>
    <line x1="526" y1="190" x2="702" y2="190" stroke="#B5D9C8" stroke-width="1"/>
    <text x="526" y="214" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#4A4A47">OWNS</text>
    <text x="526" y="236" font-size="14" fill="#181817">Per-channel outcomes</text>
  </g>

  <!-- Subtle connectors -->
  <g fill="none" stroke="#8A867D" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4">
    <path d="M230 140 H250" marker-end="url(#l1-arrow)"/>
    <path d="M479 140 H499" marker-end="url(#l1-arrow)"/>
  </g>

  <!-- Caption -->
  <line x1="10" y1="290" x2="720" y2="290" stroke="#E3E0D8" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="365" y="321" font-size="16" font-weight="700" fill="#181817">Each layer answers a different question.</text>
    <text x="365" y="346" font-size="15" fill="#4A4A47">Separate concerns, not one transaction.</text>
  </g>
</svg>
