<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 430" role="img" aria-labelledby="title desc"><title id="title">Selective escalation as a proposed experiment</title><desc id="desc">A small classifier handles incoming records. Confident decisions stay local; uncertain cases may be routed to stronger reasoning, and both routes must be evaluated for errors, latency and cost. This is an experimental architecture, not the current live pipeline.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#959993"/></marker><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#242724}.main{font-size:18px;font-weight:700}.detail{font-size:13px;fill:#69716d}.small{font-size:12px;fill:#64706a}.pill{font-size:12px;font-weight:650}.line{fill:none;stroke:#959993;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect x="0" y="0" width="730" height="430" rx="0" fill="#fafaf8" stroke="#fafaf8" stroke-width="1.4"/><rect x="192" y="25" width="346" height="74" rx="12" fill="#edf2fc" stroke="#9db8e6" stroke-width="1.4"/><text x="365" y="54" class="main" text-anchor="middle">Small classifier</text><text x="365" y="75" class="detail" text-anchor="middle">First-pass prediction and confidence</text><path class="line" d="M365 99 L365 136"/><rect x="242" y="139" width="246" height="55" rx="12" fill="#fff" stroke="#d6ddd7" stroke-width="1.4"/><text x="365" y="161" class="main" text-anchor="middle">Decision confidence</text><text x="365" y="181" class="detail" text-anchor="middle">Measured on validation data</text><path class="line" d="M242 165 L126 165"/><path class="line" d="M488 165 L604 165"/><text x="174" y="154" class="small" text-anchor="middle">Confident</text><text x="550" y="154" class="small" text-anchor="middle">Uncertain</text><rect x="28" y="210" width="275" height="75" rx="12" fill="#edf5f3" stroke="#8dbbb2" stroke-width="1.4"/><text x="165" y="240" class="main" text-anchor="middle">Keep small-model result</text><text x="165" y="264" class="detail" text-anchor="middle">No additional model call</text><path class="line" d="M126 165 L126 210"/><rect x="427" y="210" width="275" height="75" rx="12" fill="#fdf3e5" stroke="#edc48e" stroke-width="1.4"/><text x="564" y="240" class="main" text-anchor="middle">Optional stronger review</text><text x="564" y="264" class="detail" text-anchor="middle">Test whether escalation helps</text><path class="line" d="M604 165 L604 210"/><path class="line" d="M165 285 L165 334"/><path class="line" d="M564 285 L564 334"/><path class="line" d="M165 334 L564 334"/><path class="line" d="M365 334 L365 350"/><rect x="164" y="352" width="402" height="53" rx="12" fill="#fff" stroke="#cdd5ce" stroke-width="1.4"/><text x="365" y="374" class="main" text-anchor="middle">Evaluate the whole system</text><text x="365" y="391" class="detail" text-anchor="middle">Error rates · Latency · Operating cost</text></svg>