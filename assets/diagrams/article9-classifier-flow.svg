<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="t d">
<title id="t">Axon Review rules-first binary relevance pipeline</title><desc id="d">Incoming article, exclusions checked first, then inclusion keywords, then XGBoost fallback. AI-related news can continue to separate topic and subtopic classification.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#718096"/></marker></defs>
<rect width="1200" height="1040" rx="24" fill="#F7F9FC"/><text x="64" y="78" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#14223A">How our AI relevance filter works</text><text x="64" y="116" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#55667B">Rules first. XGBoost when no rule matches.</text>
<rect x="354" y="155" width="492" height="78" rx="14" fill="#14223A"/><text x="600" y="190" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="white">Incoming news article</text><text x="600" y="215" text-anchor="middle" font-family="Arial" font-size="16" fill="#D6E2F2">Title · Description · Source category</text>
<path d="M600 233 V271" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/>
<rect x="354" y="284" width="492" height="91" rx="14" fill="white" stroke="#B9C9DA" stroke-width="2"/><text x="600" y="321" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#14223A">1 · Exclusion regex?</text><text x="600" y="350" text-anchor="middle" font-family="Arial" font-size="17" fill="#52657A">Match against title + category</text>
<path d="M846 329 H955" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/><text x="885" y="315" font-family="Arial" font-size="16" fill="#64748B">Yes</text><rect x="966" y="288" width="196" height="82" rx="12" fill="#FCEBEC" stroke="#EEB7BE"/><text x="1064" y="323" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#A83245">Non-AI</text><text x="1064" y="348" text-anchor="middle" font-family="Arial" font-size="16" fill="#A83245">Stored score 0.01</text>
<path d="M600 375 V427" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/><text x="614" y="402" font-family="Arial" font-size="16" fill="#64748B">No</text>
<rect x="354" y="439" width="492" height="91" rx="14" fill="white" stroke="#B9C9DA" stroke-width="2"/><text x="600" y="477" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#14223A">2 · AI inclusion keyword?</text><text x="600" y="504" text-anchor="middle" font-family="Arial" font-size="17" fill="#52657A">Match against title + category</text>
<path d="M354 484 H243" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/><text x="275" y="470" font-family="Arial" font-size="16" fill="#64748B">Yes</text><rect x="38" y="442" width="194" height="82" rx="12" fill="#E3F5EE" stroke="#9AD9BE"/><text x="135" y="477" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#157650">AI-related</text><text x="135" y="502" text-anchor="middle" font-family="Arial" font-size="16" fill="#157650">Stored score 0.99</text>
<path d="M600 530 V582" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/><text x="614" y="558" font-family="Arial" font-size="16" fill="#64748B">No</text>
<rect x="354" y="594" width="492" height="102" rx="14" fill="#E5F3F1" stroke="#62B7A6" stroke-width="2"/><text x="600" y="634" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#0D6C62">3 · XGBoost fallback</text><text x="600" y="663" text-anchor="middle" font-family="Arial" font-size="17" fill="#356D67">Predict from title + description</text>
<path d="M600 696 V738" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/>
<rect x="354" y="750" width="492" height="92" rx="14" fill="#14223A"/><text x="600" y="790" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="white">Saved binary AI decision</text><text x="600" y="820" text-anchor="middle" font-family="Arial" font-size="17" fill="#C5DBE7">AI-related or non-AI</text>
<path d="M600 842 V887" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/>
<rect x="264" y="899" width="672" height="67" rx="12" fill="white" stroke="#C8D4E1"/><text x="600" y="928" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#14223A">If AI-related news: downstream taxonomy</text><text x="600" y="952" text-anchor="middle" font-family="Arial" font-size="16" fill="#64748B">Topic / subtopic classification (not audited here)</text>
<text x="65" y="1003" font-family="Arial" font-size="16" fill="#68778B">Axon Review · Values 0.01 and 0.99 on rule paths are not calibrated probabilities.</text>
</svg>